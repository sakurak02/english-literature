{{header}}
<main id="main-content" class="reading-shell page-main">
  <nav class="breadcrumb" aria-label="パンくずリスト"><a href="{{homeHref}}">英語で文学</a><span aria-hidden="true">/</span><a href="{{workHref}}">{{workTitle}}</a><span aria-hidden="true">/</span><span>{{recordNumber}}</span></nav>
  <article class="reading-record">
    <header class="record-header">
      <p class="section-kicker">Reading note</p>
      <h1 class="record-title">
        <span class="record-title__work">{{recordWorkTitle}}</span>
        <span class="record-title__number">英語読書記録 {{recordNumber}}</span>
      </h1>
      <p class="record-date"><time datetime="{{dateIso}}">更新日：{{dateDisplay}}</time></p>
    </header>
    <div class="record-body prose">{{recordContent}}</div>
  </article>
  <nav class="record-navigation" aria-label="読書記録の前後移動">{{recordNavigation}}</nav>
</main>
{{footer}}
