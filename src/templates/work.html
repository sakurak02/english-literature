{{header}}
<main id="main-content" class="shell page-main">
  <nav class="breadcrumb" aria-label="パンくずリスト"><a href="{{homeHref}}">英語で文学</a><span aria-hidden="true">/</span><span>{{workTitle}}</span></nav>

  <article>
    <header class="work-hero">
      <div>
        <p class="section-kicker">Work</p>
        <h1>{{workTitle}}</h1>
        <p class="original-title">{{originalTitle}}</p>
        <p class="work-byline">{{byline}}</p>
      </div>
      <div class="work-summary" aria-label="作品の読書状況">
        <span class="status-badge">{{status}}</span>
        <dl>
          <div><dt>英語読書記録</dt><dd>{{recordCount}}件</dd></div>
          <div><dt>最終更新日</dt><dd>{{lastUpdated}}</dd></div>
        </dl>
      </div>
    </header>

    <section class="work-introduction" aria-labelledby="introduction-title">
      <h2 id="introduction-title">作品について</h2>
      <p>{{introduction}}</p>
    </section>

    <section class="record-index" aria-labelledby="record-index-title">
      <div class="section-heading section-heading--row">
        <div>
          <p class="section-kicker">Reading notes</p>
          <h2 id="record-index-title">英語読書記録</h2>
        </div>
        <span class="record-count">{{recordCount}}件</span>
      </div>
      {{recordList}}
    </section>

    <aside class="work-links" aria-label="作品の関連リンク">
      <a class="text-link" href="{{guideHref}}">作品ガイドを読む</a>
      <a class="text-link text-link--external" href="{{gutenbergUrl}}" target="_blank" rel="noopener noreferrer">Project Gutenbergで原文を開く</a>
    </aside>
  </article>
</main>
{{footer}}
