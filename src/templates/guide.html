{{header}}
<main id="main-content" class="shell page-main">
  <nav class="breadcrumb" aria-label="パンくずリスト"><a href="{{homeHref}}">英語で文学</a><span aria-hidden="true">/</span><a href="{{workHref}}">{{workTitle}}</a><span aria-hidden="true">/</span><span>作品ガイド</span></nav>
  <article class="guide-page">
    <header class="guide-hero">
      <p class="section-kicker">作品ガイド</p>
      <h1>{{workTitle}}</h1>
      <p class="original-title">{{originalTitle}}</p>
      <p class="work-byline">{{guideByline}}</p>
      <ul class="guide-tags" aria-label="作品情報">
        {{guideTags}}
      </ul>
    </header>
    <div class="guide-content">{{guideContent}}</div>
    <div class="guide-actions">
      <a class="button button--primary" href="{{workHref}}#record-index-title">英語読書記録を見る</a>
      <a class="button button--secondary" href="{{workHref}}">作品ページへ戻る</a>
    </div>
  </article>
</main>
{{footer}}
